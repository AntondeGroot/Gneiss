name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push to the same PR cancels the in-flight run rather than queueing it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job ID is the status-check name branch protection matches on, so keep it
  # short and stable — renaming it silently breaks the required check.
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Fails on any TypeScript error; tsconfig has strict, noUnusedLocals,
      # noUnusedParameters, noUncheckedIndexedAccess and exactOptionalPropertyTypes.
      - name: Type-check
        run: npm run typecheck

      # A warning is an error: --max-warnings=0.
      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # The vault module's suite, under standalone Vitest. Fails on a failing
      # test, and on coverage below the ratcheted floor in vite.config.js.
      - name: Test vault module
        run: npm run test -- --coverage

      # Angular's own specs, under its unit-test builder.
      - name: Test app
        run: npm run test:app

      # Also the template type-check: tsc alone does not catch template errors,
      # only a real build does.
      - name: Build app
        run: npm run build

      # Kept building so the prototype cannot silently rot while it is still the
      # design reference.
      - name: Build prototype
        run: npm run prototype:build

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  # Publishes the laptop build to GitHub Pages. Gated on `verify`, so a build
  # that fails any gate is never deployed — this app writes to the user's notes,
  # so shipping an unverified build is not a cosmetic risk.
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # --base-href=/Gneiss/ because this is a project page, not a user page,
      # and the 404.html fallback so deep links reach the router.
      - name: Build for Pages
        run: npm run build:pages

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/gneiss/browser

      - id: deployment
        uses: actions/deploy-pages@v4
